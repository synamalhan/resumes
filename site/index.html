<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume Builder</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#f3f3f3;color:#111}
  .ui{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #d0d0d0;padding:8px 10px}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0;align-items:center}
  button,.btn,select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid #aaa;border-radius:8px;background:#fff;color:#111;text-decoration:none;cursor:pointer}
  button.on{background:#111;color:#fff;border-color:#111}
  #status{font-size:12px;color:#a15c00}
  .hint{font-size:12px;color:#666;margin:4px 0}
  .paper{background:#fff;max-width:820px;margin:12px auto;padding:14px 18px;font-family:"Latin Modern Roman","CMU Serif",Georgia,serif;font-size:12px;line-height:1.3;box-shadow:0 1px 4px #0003}
  .paper a{color:inherit;text-decoration:none}
  .c{text-align:center}.nm{font-size:1.6em;font-weight:bold}
  h2{font-size:1.25em;margin:6px 0 3px;border-bottom:1px solid #000;padding-bottom:1px}
  .sp{display:flex;justify-content:space-between;gap:10px}
  ul{margin:1px 0 4px;padding-left:1.2em} li{margin:1px 0}
  .ln{margin:2px 0}.ent{margin-top:4px}
  .hid{opacity:.35;outline:1px dashed #c33}
  .ed{outline:1px dotted #99a;border-radius:2px}.ed:focus{background:#fffbe0;outline:1px solid #46c}
  .extra{background:#eef6ff}
  .tagbar{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0 4px;font-family:system-ui,sans-serif}
  .tagbar button{font-size:10px;padding:2px 5px;border-radius:5px}
  .small{font-size:11px;padding:2px 6px;margin-left:4px}
  dialog{width:min(92vw,700px)} dialog textarea{width:100%;height:50vh;font:12px monospace}
  @page{size:A4;margin:.2in .45in}
  @media print{
    body{background:#fff}
    .ui,.tagbar,.small,.hint{display:none!important}
    .hid{display:none!important}
    .paper{box-shadow:none;margin:0;padding:0;max-width:none;font-size:8pt;line-height:1.1}
    .ed,.extra{outline:none!important;background:none!important}
    h2{margin:5px 0 3px}
  }
</style>
</head>
<body>
<div class="ui">
  <div class="row">
    <select id="variant" aria-label="Resume version"></select>
    <button id="editBtn">Edit</button>
    <button id="pdfBtn">Download PDF</button>
    <a class="btn" id="texLink" href="#">LaTeX PDF</a>
  </div>
  <div class="row">
    <button id="saveBtn">Save to GitHub</button>
    <button id="jsonBtn">Raw JSON</button>
    <button id="tokenBtn">Token</button>
    <button id="discardBtn">Discard draft</button>
    <span id="status"></span>
  </div>
  <div class="hint">Edit: tap text to change it; the small version buttons under each line choose which resumes include it. Phone PDF: Download PDF, then Share, Print, pinch the preview, Share, Save to Files.</div>
</div>
<div class="paper" id="paper"></div>
<dialog id="dlg">
  <textarea id="raw"></textarea>
  <div class="row"><button id="applyRaw">Apply</button><button id="closeRaw">Cancel</button></div>
</dialog>

<script>
const ALL = ['main','ml','ds','genai','cv','res','swe','apple'];
let data, deployed, variant = localStorage.getItem('variant') || 'main', edit = false;
const $ = (s) => document.querySelector(s);

function el(t, a = {}, ...c) {
  const e = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const x of c.flat()) if (x != null) e.append(x.nodeType ? x : document.createTextNode(x));
  return e;
}
const vis = (n) => !n.v || n.v.includes(variant);
const mark = (node, o) => { if (!vis(o)) node.classList.add('hid'); return node; };

function status(msg) { $('#status').textContent = msg || ''; }
function dirty() {
  localStorage.setItem('draft', JSON.stringify(data));
  status('Unsaved draft (stored on this device)');
}

// editable text span bound to o[k]
function ed(o, k, cls = '') {
  const s = el('span', { class: cls });
  s.textContent = o[k] || '';
  if (edit) {
    s.contentEditable = 'true';
    s.classList.add('ed');
    s.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); s.blur(); } };
    s.oninput = () => { o[k] = s.textContent; dirty(); };
  }
  return s;
}

function toggle(o, v) {
  let cur = o.v || ALL.slice();
  cur = cur.includes(v) ? cur.filter((x) => x !== v) : [...cur, v];
  if (ALL.every((x) => cur.includes(x))) delete o.v; else o.v = cur;
  dirty();
}
function tagbar(o) {
  if (!edit) return null;
  const b = el('div', { class: 'tagbar' });
  for (const v of ALL) {
    const on = !o.v || o.v.includes(v);
    b.append(el('button', { class: on ? 'on' : '', onclick: () => { toggle(o, v); render(); } }, v));
  }
  return b;
}

// main text + inline extras (+ tail)
function tnode(o) {
  const s = el('span', {}, ed(o, 't'));
  for (const x of o.extra || []) {
    if (!edit && !vis(x)) continue;
    s.append(mark(ed(x, 't', 'extra'), x));
  }
  if (o.tail) s.append(o.tail);
  return s;
}

function render() {
  const p = $('#paper');
  p.replaceChildren();
  const info = data.variants[variant];
  $('#texLink').href = info.file + '.pdf';

  p.append(el('div', { class: 'c' },
    el('div', { class: 'nm' }, ed(data, 'name')),
    el('div', {}, ed(data.taglines, variant)),
    el('div', {}, ...data.links.flatMap((l, i) => [i ? ' | ' : '', el('a', { href: l.url }, l.label)]))));

  const E = data.education;
  p.append(el('h2', {}, 'Education'),
    el('div', { class: 'sp' }, el('b', {}, ed(E, 'school')), el('i', {}, ed(E, 'date'))),
    el('div', { class: 'sp' }, ed(E, 'degree'), ed(E, 'gpa')),
    el('div', {}, el('b', {}, 'Honors: '), tnode(E.honors)));

  for (const s of data.sections) {
    if (!edit && !vis(s)) continue;
    const box = mark(el('div'), s);
    box.append(el('h2', {}, s.title));
    if (s.v) box.append(tagbar(s));
    if (s.kind === 'text') box.append(el('div', {}, ed(s, 'text')));
    if (s.kind === 'skills') {
      for (const l of s.items) {
        if (!edit && !vis(l)) continue;
        box.append(mark(el('div', { class: 'ln' }, el('b', {}, ed(l, 'label'), ': '), tnode(l), tagbar(l)), l));
      }
    }
    if (s.kind === 'entries') {
      for (const e of s.items) {
        if (!edit && !vis(e)) continue;
        const bs = e.bullets.filter((b) => edit || vis(b));
        if (!edit && !bs.length) continue;
        const ent = mark(el('div', { class: 'ent' }), e);
        ent.append(el('div', { class: 'sp' },
          el('span', {}, el('b', {}, ed(e, 'head')), e.after !== undefined ? [' — ', ed(e, 'after')] : ''),
          e.date !== undefined ? el('i', {}, ed(e, 'date')) : ''));
        if (e.v || edit) ent.append(tagbar(e));
        const ul = el('ul');
        for (const b of bs) {
          const li = mark(el('li'), b);
          li.append(tnode(b));
          if (edit) li.append(el('button', { class: 'small', onclick: () => { e.bullets.splice(e.bullets.indexOf(b), 1); dirty(); render(); } }, '×'));
          li.append(tagbar(b));
          ul.append(li);
        }
        ent.append(ul);
        if (edit) ent.append(el('button', { class: 'small', onclick: () => { e.bullets.push({ t: 'New bullet' }); dirty(); render(); } }, '+ bullet'));
        box.append(ent);
      }
    }
    p.append(box);
  }
}

function pdf() {
  edit = false; $('#editBtn').classList.remove('on'); render();
  document.title = data.variants[variant].title;
  setTimeout(() => window.print(), 80);
}

async function saveToGitHub() {
  const token = localStorage.getItem('gh_token');
  if (!token) return alert('Tap "Token" first and paste a GitHub token with Contents read/write on synamalhan/resumes.');
  const api = 'https://api.github.com/repos/synamalhan/resumes/contents/data/resume.json';
  const h = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
  try {
    status('Saving...');
    const cur = await (await fetch(api + '?ref=main', { headers: h })).json();
    if (!cur.sha) throw new Error(cur.message || 'Could not read file');
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2) + '\n')));
    const r = await fetch(api, { method: 'PUT', headers: h, body: JSON.stringify({ message: 'Update resume content', content, sha: cur.sha, branch: 'main' }) });
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    status('Saved. LaTeX PDFs rebuild in about 2-3 minutes.');
  } catch (e) { status('Save failed: ' + e.message); }
}

async function init() {
  deployed = await (await fetch('data/resume.json', { cache: 'no-store' })).json();
  const d = localStorage.getItem('draft');
  data = deployed;
  if (d) {
    const dd = JSON.parse(d);
    if (JSON.stringify(dd) === JSON.stringify(deployed)) localStorage.removeItem('draft');
    else { data = dd; status('Unsaved draft loaded'); }
  }
  if (!data.variants[variant]) variant = 'main';
  const sel = $('#variant');
  for (const [k, v] of Object.entries(data.variants)) sel.append(el('option', { value: k }, v.label));
  sel.value = variant;
  sel.onchange = () => { variant = sel.value; localStorage.setItem('variant', variant); render(); };
  $('#editBtn').onclick = (e) => { edit = !edit; e.target.classList.toggle('on', edit); render(); };
  $('#pdfBtn').onclick = pdf;
  $('#saveBtn').onclick = saveToGitHub;
  $('#tokenBtn').onclick = () => { const t = prompt('GitHub fine-grained token (Contents: read/write on synamalhan/resumes only):'); if (t) localStorage.setItem('gh_token', t.trim()); };
  $('#discardBtn').onclick = () => { if (confirm('Throw away local edits?')) { localStorage.removeItem('draft'); data = JSON.parse(JSON.stringify(deployed)); status(''); render(); } };
  $('#jsonBtn').onclick = () => { $('#raw').value = JSON.stringify(data, null, 2); $('#dlg').showModal(); };
  $('#closeRaw').onclick = () => $('#dlg').close();
  $('#applyRaw').onclick = () => { try { data = JSON.parse($('#raw').value); dirty(); $('#dlg').close(); render(); } catch (e) { alert('Invalid JSON: ' + e.message); } };
  window.onbeforeprint = () => { if (edit) { edit = false; render(); } };
  render();
}
init().catch((e) => { document.body.append('Could not load resume data: ' + e.message); });
</script>
</body>
</html>
