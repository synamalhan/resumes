name: Build resumes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate LaTeX from data/resume.json
        run: node scripts/make_tex.mjs

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Compile every version
        run: |
          mkdir -p out
          for f in build/*.tex; do
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory=out "$f"
          done
          rm -f out/*.aux out/*.log out/*.out
          for f in out/*.pdf; do
            pages=$(pdfinfo "$f" | awk '/^Pages:/ {print $2}')
            if [ "$pages" != "1" ]; then echo "::warning::$f is $pages pages (should be 1)"; fi
          done

      - name: Assemble site
        run: |
          cp site/index.html out/index.html
          mkdir -p out/data
          cp data/resume.json out/data/resume.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
